# Outbound allowlist for the panel. The web container has no direct internet access;
# it reaches only these hosts over HTTPS (CONNECT to 443) through this proxy.
http_port 3128

acl allowed_hosts dstdomain mods.vintagestory.at moddbcdn.vintagestory.at
acl ssl_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !ssl_port
http_access allow allowed_hosts
http_access deny all

cache deny all
access_log daemon:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /tmp
max_filedescriptors 4096
