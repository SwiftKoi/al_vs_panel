# Локальные (не для репозитория) дополнения к compose.yaml:
# подключаем панель к сети платформы, чтобы Caddy мог её проксировать,
# и задаём постоянное имя контейнера.
services:
  web:
    container_name: test-alegacy-online-panel
    networks:
      - default
      - web

networks:
  web:
    external: true
