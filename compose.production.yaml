services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      WorkspacePath: ${HOST_WORKSPACE_PATH:?Set HOST_WORKSPACE_PATH in .env}
    secrets:
      - admin_password
      - ssh_private_key
    volumes:
      - type: bind
        source: ./Server/Production
        target: ${HOST_WORKSPACE_PATH}/Server/Production
        read_only: true
      - type: bind
        source: ./Server/Production/Data
        target: ${HOST_WORKSPACE_PATH}/Server/Production/Data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - app_data:/var/lib/alegacy/data
      - data_protection_keys:/var/lib/alegacy/keys
    networks:
      - application
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env}"

    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN to the public DNS name, for example panel.example.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - application
      - public
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    depends_on:
      - web

networks:
  application:
    internal: true
  public:

volumes:
  app_data:
  data_protection_keys:
  caddy_data:
  caddy_config:

secrets:
  admin_password:
    file: ./secrets/admin-password
  ssh_private_key:
    file: ./secrets/ssh-private-key
